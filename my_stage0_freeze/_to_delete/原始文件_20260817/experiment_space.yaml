version: stage0-v0.2
status: active_protocol_frozen_for_implementation_pending_pilot_a_go_decision

active_protocol:
  protocol_id: stage0-v0.2
  predecessor_protocol_id: stage0-v0.1
  activation_reason: preimplementation_risk_audit_found_model_interface_difficulty_and_evaluation_gaps
  lifecycle_state: pre_pilot_a
  reference_physical_parameters_changed_from_v0_1: false
  reference_dataset_sizes_changed_from_v0_1: false
  allowed_work_before_pilot_a_pass:
    - deterministic_scenario_generator_implementation
    - strengthened_milp_and_unit_tests
    - default_scip_baseline_implementation
    - transformed_lp_candidate_mapping_spike
    - native_teacher_interface_spike
    - pilot_a_only
  currently_blocked_artifacts_and_phases:
    formal_id_train_validation_test_scenario_materialization: true
    formal_ood_scenario_materialization: true
    formal_train_validation_expert_label_generation: true
    model_training: true
    pilot_b: true
    formal_solver_evaluation: true
  staged_unlock_sequence:
    pilot_a_go_unlocks:
      - formal_scenario_materialization
      - formal_train_validation_expert_label_generation
      - three_seed_model_training_and_validation_diagnostics
      - selected_checkpoint_manifest_creation
    pilot_b_requires:
      - recorded_pilot_a_go
      - completed_three_seed_validation_diagnostics
      - frozen_selected_checkpoint_manifest
    pilot_b_pass_and_frozen_hash_match_unlocks:
      - formal_id_test_solver_evaluation
      - formal_ood_solver_evaluation
    pilot_a_go_alone_does_not_unlock_formal_test_or_ood_solver_runs: true
  on_any_required_gate_failure: create_stage0_v0_3_or_later_decision_record_before_any_recalibration
  silent_retuning_or_instance_filtering_for_difficulty_forbidden: true
  changes_requiring_a_new_protocol_version:
    - user_or_candidate_scale
    - demand_or_capacity_distribution
    - energy_or_mission_calibration
    - mathematical_objective_or_feasible_region
    - pilot_gate_threshold
    - candidate_or_teacher_semantics

historical_protocols:
  stage0_v0_1:
    former_version_value: stage0-v0.1
    former_status_value: structure_and_reference_calibration_frozen_ready_for_implementation
    reference_values_retained_in_v0_2: true
    former_solver_parameter_file_id: scip_10_0_2_stage0_v0_1.set
    former_candidate_semantics_included_all_fractional_integer_candidates: true
    note: retained_as_design_history_not_the_active_execution_protocol

documentation_contract:
  main_stage0_specification: scope.md
  decision_history: decisions.md
  canonical_notation_index: notation.md
  canonical_unit_and_conversion_rules: units.md
  machine_readable_parameter_source: experiment_space.yaml
  pilot_execution_and_acceptance_protocol: pilot_protocol_v0.2.md

mathematical_program:
  class: MILP
  is_miqp: false
  all_wireless_and_energy_coefficients_precomputed_before_optimization: true
  products_of_two_decision_variables: false
  implementation_formulation_version: strengthened_scaled_v0_2
  optimization_units:
    physical_input_and_archival_units: SI_as_declared_by_field
    coordinate_and_propagation_precomputation_distance_unit: m
    milp_bandwidth_unit: MHz
    milp_rate_and_capacity_unit: Mbps
    milp_energy_unit: kJ
    objective_unit: dimensionless
    spectral_efficiency_numeric_unit: Mbps_per_MHz_equal_numerically_to_bps_per_Hz
    convert_once_at_model_boundary: true
    mixed_scaled_and_unscaled_coefficients_in_one_constraint_forbidden: true
    retain_original_si_values_in_scenario_artifacts: true
  numerical_scaling_validation:
    compare_scaled_and_si_formulations_on_enumerable_tiny_instances: true
    require_same_optimal_integer_decisions_and_objective_within_tolerance: true
    record_coefficient_range_before_and_after_scaling: true
    fail_on_nan_or_infinite_edge_upper_bound: true
    nonpositive_or_below_b_min_edge_upper_bound_action: safely_remove_edge_and_log_proof_components

confirmed_problem:
  joint_decisions:
    - uav_base_station_placement
    - user_association
    - downlink_access_resource_allocation
    - backhaul_capacity_feasible_traffic_allocation
  constraint_families:
    - uav_availability
    - link_capacity
    - energy_budget
    - critical_user_threshold_indicator_linking
  disaster_zone:
    terrestrial_access_infrastructure_available: false
    user_access_via_uavs_only: true

confirmed_approach:
  learning_paradigm: supervised_gnn
  role: score_and_rank_solver_internal_legal_branching_candidates
  directly_predict_final_solution: false
  remove_candidate_locations: false
  remove_user_location_connections: false
  permanently_fix_variables: false
  unsafe_pruning: false
  learning_component_preserves_defined_model_feasible_region: true
  deterministic_physical_preprocessing_is_part_of_model_definition: true
  warm_start_as_main_learning_task: false
  fallback_to_default_solver_branching: true
  branching_candidate_scope:
    source: pyscipopt_getLPBranchCands_at_current_lp_branching_callback
    include_all_fractional_integer_candidates: false
    active_candidate_semantics: first_npriolpcands_entries_only
    returned_fields_to_log: [nlpcands, npriolpcands, nfracimplvars]
    returned_candidate_order_is_semantic: true
    explicit_fractional_priority_lp_candidates_only: true
    exclude_entries_after_npriolpcands: true
    implicit_integer_candidates_excluded: true
    non_lp_external_or_pseudo_candidate_context: return_didnotrun_and_fallback_to_scip
    prefilter_by_variable_type: false
    include_deployment_variables: true
    include_association_variables: true
    include_critical_service_indicator_variables: true
    include_other_model_integer_variables: true
    include_continuous_variables: false
    gnn_output: candidate_score_and_ranking_only
    gnn_predicts_final_variable_value: false
    gnn_selects_branch_direction: false
    solver_creates_branch_children: true
    candidate_mask_required: true
    transformed_lp_mapping:
      mapping_lifetime: current_callback_only
      rebuild_on_every_applicable_branching_callback: true
      map_returned_transformed_variable_or_column_to_current_graph_column: true
      original_model_variable_index_must_not_be_used_as_lp_column_index: true
      handle_presolve_fixing_aggregation_elimination_and_reordering: true
      handle_dynamic_rows_cuts_and_missing_columns: true
      selected_variable_identity_must_match_one_of_first_npriolpcands_entries: true
      mapping_failure_action: return_didnotrun_and_default_scip_fallback
      unit_tests_required_before_pilot_a_pass:
        - presolve_off_identity_case
        - presolve_on_fixed_or_aggregated_variables
        - dynamic_cut_rows_and_reordered_columns
        - repeated_callbacks_with_changed_lp
    ablation_baseline: deployment_variables_only
    deployment_only_ablation_uses_same_selected_checkpoint: true
    deployment_only_ablation_retraining: false
    deployment_only_ablation_mask: legal_deployment_candidates_only
    deployment_only_no_legal_candidate: default_scip_branching
  supervision:
    expert_family: strong_branching_candidate_scoring
    expert: unresolved_until_native_teacher_interface_spike
    expert_interface_resolution:
      required_in_pilot_a: true
      preferred_implementation_id: scip_native_vanillafullstrong_c_api
      preferred_symbol_to_verify: SCIPgetVanillafullstrongData
      preferred_requirement: scores_match_active_first_npriolpcands_candidate_order
      native_interface_acceptance_tests:
        - returns_complete_scores_for_every_active_candidate
        - does_not_commit_a_branch_during_offline_label_query
        - repeated_query_state_restoration_is_verified
        - scores_and_candidate_ids_are_deterministic_under_frozen_solver_settings
        - tiny_instance_selected_candidate_matches_native_branching_reference
      native_vanillafullstrong_offline_label_settings_must_be_explicitly_recorded:
        collectscores: true
        scoreall: true
        integralcands: false
        idempotent: true
        donotbranch: true
      fallback_implementation_id: pyscipopt_per_candidate_strongbranch_oracle
      fallback_api_to_verify: PySCIPOpt_Model_getVarStrongbranch
      fallback_operation: explicitly_score_each_active_candidate_with_supported_strong_branch_calls
      fallback_must_not_be_named: scip_native_vanilla_full_strong
      fallback_canonical_display_name: project_defined_python_side_all_candidate_strong_branching_oracle
      resolved_implementation_id_recorded_in_every_label_artifact: true
      interface_resolution_recorded_before_formal_labels: true
      formal_label_generation_blocked_until_resolved: true
    expert_usage: offline_sampled_training_and_validation_nodes_plus_discarded_pilot_feasibility_calls
    candidate_population: first_npriolpcands_current_lp_fractional_explicit_integer_candidates
    score_all_current_candidates_when_valid: true
    store_resolved_teacher_candidate_scores: true
    store_best_and_tied_best_candidates: true
    invalid_or_incomplete_labels: discard_and_log_reason
    sampling:
      include_root_when_branchable: true
      root_depth: 0
      later_node_query_probability: 0.05
      later_node_depth_range_inclusive: [1, 8]
      max_labels_per_instance: 10
      maximum_sampled_node_depth: 8
      label_generation_time_limit_per_instance_s: 120
      applies_to_splits: [train, validation]
      pilot_diagnostic_labels_allowed_but_discarded: true
      expert_labels_on_formal_test_or_ood: false
      train_validation_theoretical_label_upper_bound: 6800
      actual_valid_label_count_is_data_dependent_and_must_be_reported: true
      exploration_on_unqueried_nodes: pseudo_cost_branching
      split_scenarios_before_node_sampling: true
    graph_state:
      source: scip_transformed_current_lp
      representation: variable_constraint_bipartite_graph
      edge_definition: nonzero_constraint_coefficient
      stable_candidate_to_solver_variable_mapping_required: true
      stable_means_within_current_callback_not_across_presolve_or_nodes: true
      mapping_rebuilt_per_callback: true
    training:
      paradigm: behavioral_cloning
      primary_loss: masked_cross_entropy
      tie_handling: multi_positive_with_explicit_scaled_absolute_difference
      tie_rule: absolute_s_i_minus_s_max_le_tau_tie_times_max_one_absolute_s_max
      tie_relative_tolerance: 1.0e-9
      tied_best_target_distribution: uniform_over_tied_best_candidates
      tied_best_target_probability: one_divided_by_tied_best_candidate_count
      validation_score_regret: s_max_minus_selected_expert_score_divided_by_max_one_absolute_s_max
      validation_score_regret_scope: validation_expert_labels_only
      score_regression_as_main_task: false
      learning_to_rank_as_main_task: false
      dagger: false
      reinforcement_learning: false
      online_retraining: false
      architecture: one_variable_to_constraint_to_variable_message_passing_cycle
      hidden_dimension: 64
      optimizer: adam
      initial_learning_rate: 0.001
      batch_size: 32
      maximum_epochs: 200
      validation_minimum_improvement: 0.0001
      learning_rate_plateau_patience_epochs: 10
      learning_rate_reduction_factor: 0.2
      early_stopping_patience_epochs: 20
      restore_best_validation_checkpoint: true
      model_training_seeds: [0, 1, 2]
      per_model_training_wall_time_limit_s: 7200
      large_hyperparameter_search: false
      formal_checkpoint_selection: minimum_validation_masked_cross_entropy
      checkpoint_selection_tie_break: smaller_training_seed
      formal_solver_evaluation_checkpoint_count: 1
      all_three_seeds_receive_predeclared_validation_solve_diagnostics: true
      validation_solve_diagnostics:
        source: validation
        exact_instance_count: 30
        small_medium_large_counts: [10, 10, 10]
        deterministic_selection: lowest_scenario_seeds_within_scale
        solver_time_limit_s: 60
        metrics: [wall_time, nodes, lp_iterations, normalized_absolute_bound_gap, gnn_overhead]
        used_for_checkpoint_selection: false
        report_all_three_seeds: true
      non_selected_seeds_report_training_validation_and_solve_diagnostics_only: true
      selected_checkpoint_consistency:
        write_selected_checkpoint_manifest_before_pilot_b: true
        manifest_fields: [training_seed, checkpoint_hash, feature_schema_hash, normalizer_hash, training_data_hash]
        pilot_b_must_use_manifest_checkpoint: true
        formal_evaluation_must_use_same_manifest_checkpoint: true
        checkpoint_reselection_after_pilot_b_forbidden: true
  online_branching:
    policy: budgeted_early_tree_gnn_then_default_scip
    require_legal_lp_candidates: true
    candidate_source_must_equal_training_candidate_source: true
    eligible_candidate_slice: first_npriolpcands
    applicable_callback_context: lp_branching_with_nonempty_priority_candidate_slice
    other_callback_context_action: return_didnotrun_for_scip_fallback
    max_tree_depth_inclusive: 8
    max_calls_per_instance: 64
    single_call_soft_latency_limit_s: 0.5
    soft_latency_limit_is_not_preemptive_cancellation: true
    overrun_handling: finish_current_call_use_valid_result_then_disable_future_gnn_calls_for_instance
    cumulative_gnn_overhead_budget_per_instance_s: 10.0
    cumulative_budget_checked_after_each_completed_call: true
    cumulative_budget_may_exceed_by_at_most_one_completed_call: true
    formal_inference_device: cpu
    inference_cpu_threads: 1
    pytorch_intraop_threads: 1
    pytorch_interop_threads: 1
    model_warmup_before_timed_solve: true
    model_loading_and_warmup_reported_separately: true
    select_highest_scoring_legal_candidate: true
    solver_retains_branch_direction: true
    on_budget_exhaustion: default_scip_for_rest_of_instance
    confidence_threshold_fallback: false
    instance_level_circuit_breaker: true
    deterministic_fallback_reasons:
      - no_legal_candidate
      - inapplicable_lp_state
      - model_or_feature_load_failure
      - candidate_mapping_failure
      - schema_or_shape_mismatch
      - inference_exception_or_unrecoverable_timeout
      - soft_latency_overrun_disables_future_calls_after_current_result
      - nan_or_infinite_output
      - selected_variable_not_legal_candidate
      - device_or_memory_error
  audit_logging:
    full_candidate_logs: training_validation_labels_and_predeclared_audit_subset_only
    performance_runs: aggregate_low_overhead_logs
    full_log_per_call_fields:
      - run_instance_node_parent_and_depth
      - candidate_ids_types_and_lp_values
      - policy_scores_and_selected_variable
      - feature_transfer_inference_and_postprocess_time
      - fallback_flag_and_standard_reason_code
      - actual_solver_branch
    performance_log_per_call_fields:
      - run_instance_node_parent_and_depth
      - candidate_total_and_counts_by_variable_type
      - selected_variable_id_and_type
      - feature_transfer_inference_and_postprocess_time
      - fallback_flag_and_standard_reason_code
      - actual_solver_branch
    performance_log_excludes:
      - per_candidate_ids_and_lp_values
      - all_candidate_policy_scores
    predeclared_full_audit_subset:
      source: id_test
      selected_checkpoint_only: true
      medium_instances: 10
      large_instances: 10
      deterministic_selection: lowest_scenario_seeds_within_scale
      separate_rerun_not_in_formal_performance_table: true
    per_solve_fields:
      - data_model_code_solver_and_parameter_versions_or_hashes
      - hardware_threads_device_and_seed
      - status_objective_incumbent_best_bound_and_gap
      - wall_time_nodes_and_lp_iterations
      - gnn_calls_overhead_latency_distribution_and_fallbacks
  solver_retains:
    - final_branching_execution
    - feasibility_validation
    - constraint_satisfaction
    - valid_primal_and_dual_bounds
    - mip_gap_computation
    - pruning_and_termination
    - optimality_certificate_when_status_is_optimal
  termination_reporting:
    optimal_status: report_global_optimality_under_model_and_numerical_tolerances
    nonzero_gap_limit: report_solution_quality_within_configured_gap_not_exact_optimality
    time_or_resource_limit: report_incumbent_if_available_best_bound_and_gap
    no_feasible_incumbent: state_explicitly
  research_positioning:
    label: auditable_feasible_region_preserving_learning_augmented_branch_and_bound
    reliability_is_empirical_claim_not_prevalidated: true
    evaluation_scope:
      - preserve_full_feasible_region
      - solver_validated_decisions_and_bounds
      - fallback_reliability
      - inference_overhead_accounting
      - average_and_tail_performance
      - out_of_distribution_scenario_evaluation
      - auditable_branching_logs
    excluded_trustworthy_ai_topics:
      - privacy
      - adversarial_attacks
      - causal_inference
      - general_ai_fairness
      - human_ai_collaboration

frozen_structure:
  temporal_model: single_static_snapshot
  time_indexed_model: false
  multi_period_joint_optimization: false
  trajectory_optimization: false
  independent_snapshots_for_dataset: true
  uncertainty:
    model: deterministic_per_instance
    all_instance_inputs_known_before_optimization: true
    stochastic_scenarios_within_instance: false
    probability_distributions_in_optimization: false
    uncertainty_sets_in_optimization: false
    online_information_updates: false
    different_deterministic_instances_allowed: true
  placement:
    representation: discrete_horizontal_candidate_locations
    candidate_coordinates_known_before_optimization: true
    continuous_horizontal_position_optimization: false
    altitude_mode: fixed_per_instance
    altitude_is_decision_variable: false
    multiple_altitude_candidates_within_instance: false
    candidate_generation:
      method: regular_grid
      layout: cell_centered_square_grid
      reference_region_side_m: 2000.0
      fixed_altitude_m: 100.0
      operational_horizontal_separation_m: 250.0
      no_fly_safety_buffer_m: 30.0
      filter_infeasible_locations: true
      filtering_stage: preprocessing
      user_distribution_driven: false
      internal_coordinate_system: local_planar_meters
      geographic_coordinates_must_be_projected_first: true
      grid_spacing_at_least_operational_horizontal_separation: true
      pairwise_candidate_conflict_constraints: false
      scale_instances_by_area_users_and_grid_extent_not_unsafe_spacing: true
      infeasible_regions: polygons_with_safety_buffer
    deterministic_preprocessing:
      part_of_model_definition: true
      independent_of_gnn_output: true
      ordered_filters:
        - no_fly_or_safety_buffer_candidate
        - fixed_energy_exceeds_usable_energy_candidate
        - unavailable_single_hop_backhaul_candidate
        - access_edge_below_fixed_sinr_threshold
      log_removed_object_and_standard_reason: true
  scenario_geometry:
    gateway_location_generation: predeclared_boundary_or_outside_boundary_anchor
    anchor_types:
      - edge_midpoint
      - corner
    save_anchor_id_coordinates_height_and_seed: true
    id_anchor_family: edge_midpoint
    id_gateway_outward_offset_m: 250.0
    gateway_height_m: 25.0
    staging_site_default: colocated_with_gateway
  data_interface:
    scenario_table:
      - region_gateway_staging_uav_and_mission_parameters
    users_table:
      - coordinates_class_demand_and_minimum_service
    candidates_table:
      - coordinates_altitude_fixed_energy_and_backhaul_capacity
    access_links_table:
      - user_location_gain_sinr_spectral_efficiency_and_eligibility
    every_physical_field_has_explicit_unit: true
  fleet:
    homogeneous_uavs: true
    heterogeneous_uav_types: false
    individual_capability_parameters: false
    shared_capability_parameters_within_instance: true
  service_policy:
    critical_user_minimum:
      minimum_level_known_before_optimization: true
      require_all_critical_users_for_feasibility: false
      primary_priority: maximize_number_meeting_minimum
      use_service_satisfaction_indicator: true
      threshold_role: soft_objective_evaluation_not_all_users_hard_requirement
      critical_tiers: 1
      equal_weight_within_critical_tier: true
      real_world_identity: mission_critical_field_responder_terminals
      examples:
        - firefighter_terminal
        - search_and_rescue_terminal
        - field_medical_terminal
        - emergency_command_terminal
      ordinary_user_identity: disaster_affected_public_terminal
      identity_assigned_by_scenario_role_before_optimization: true
      identity_inferred_or_modified_by_gnn: false
      common_minimum_rate_within_critical_tier: true
      common_minimum_rate_parameter: q_crit_bps
      common_minimum_rate_bps: 2000000.0
      critical_user_fraction: 0.20
      ordinary_user_hard_minimum_rate: false
    objective_priority:
      type: single_normalized_weighted_sum
      solve_mode: single_solve
      strict_lexicographic_guarantee: false
      lower_priority_cannot_degrade_higher_priority: false
      order:
        - maximize_number_of_critical_users_meeting_minimum
        - minimize_total_critical_minimum_shortfall
        - maximize_total_demand_capped_service
        - minimize_normalized_uav_deployment_count_with_small_weight
      service_value_capped_at_user_demand: true
      deployment_count_penalty: true
      deployment_penalty_scale: small_relative_to_service_terms
      energy_penalty_in_objective: false
      energy_budget_is_hard_constraint: true
      normalized_components:
        critical_hit_ratio: mean_critical_satisfaction_indicator
        critical_relative_shortfall: mean_shortfall_divided_by_user_threshold
        total_effective_service_ratio: total_capped_service_divided_by_total_demand
        deployment_fraction: deployed_uavs_divided_by_available_uavs
      positive_weights_sum_to_one: true
      weight_order: alpha_H_gt_alpha_Q_gt_alpha_R_gt_alpha_D_gt_zero
      frozen_reference_weights:
        alpha_H: 0.65
        alpha_Q: 0.20
        alpha_R: 0.14
        alpha_D: 0.01
      frozen_before_pilot_a: true
      neither_pilot_can_silently_retune_weights: true
      fixed_during_id_and_ood_test: true
  association:
    max_uavs_per_user: 1
    simultaneous_multi_uav_connectivity: false
    multi_uav_rate_aggregation: false
    unserved_user_allowed: true
    partial_service_allowed: true
  access:
    optimized_direction: uav_to_user_downlink
    uplink_separately_optimized: false
    uplink_signaling_and_reporting_assumed_not_capacity_bottleneck: true
    intra_uav_user_access: continuous_orthogonal_ofdma_bandwidth_abstraction
    tdma_equivalent_interpretation: false
    allocation_variable: actual_used_bandwidth
    continuous_bandwidth_allocation: true
    per_uav_total_bandwidth_budget: true
    spectral_efficiency_known_before_optimization: true
    independent_rate_decision_variable: false
    rate_definition: spectral_efficiency_times_actual_used_bandwidth
    reserved_but_unused_bandwidth_allowed: false
    transmit_power_model: fixed_power_spectral_density
    noise_model: fixed_noise_power_spectral_density
    interference_model: fixed_conservative_interference_power_spectral_density
    sinr_depends_on_allocated_bandwidth: false
    decision_dependent_interference: false
    optimize_transmit_power: false
    orthogonal_with_backhaul: true
    access_backhaul_isolation: preassigned_non_overlapping_frequency_bands
    dynamic_access_backhaul_spectrum_partition: false
    cross_layer_access_backhaul_interference: false
    center_frequency_hz: 2000000000.0
    bandwidth_per_uav_hz: 20000000.0
    transmit_psd_w_per_hz: 5.0e-8
    transmit_psd_reference_plane: antenna_port_conducted_rf_output
    full_band_conducted_transmit_power_w: 1.0
    transmit_antenna_gain_db: 3.0
    receive_antenna_gain_db: 0.0
    fixed_device_loss_db: 2.0
    receiver_noise_figure_db: 9.0
    receiver_noise_factor_linear: 7.943282347
    reliability_margin_db: 6.0
    minimum_sinr_linear: 0.352835
    minimum_sinr_db: -4.5243
    minimum_active_bandwidth_hz: 100000.0
    propagation_precomputation:
      main_model: al_hourani_probabilistic_los_nlos_mean_path_loss
      main_environment: urban
      sensitivity_environments:
        - suburban
